<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batcomputer // Roster Protocol</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bat-void: #050608;
            --bat-armor: #12151c;
            --bat-steel: #232834;
            --bat-gold: #f5c518;
            --bat-gold-glow: rgba(245, 197, 24, 0.35);
        }

        body {
            background-color: var(--bat-void);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(245, 197, 24, 0.08) 0%, transparent 60%),
                linear-gradient(rgba(18, 21, 28, 0.9) 1px, transparent 1px),
                linear-gradient(90deg, rgba(18, 21, 28, 0.9) 1px, transparent 1px);
            background-size: 100% 100%, 24px 24px, 24px 24px;
            min-height: 100vh;
            color: #e2e8f0;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bat-terminal {
            border-radius: 6px;
            background: linear-gradient(165deg, var(--bat-armor) 0%, #0a0c10 100%);
            border: 1px solid var(--bat-steel);
            border-top: 3px solid var(--bat-gold);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 25px rgba(245, 197, 24, 0.12);
            position: relative;
            overflow: hidden;
        }

        .bat-header {
            border-bottom: 1px solid var(--bat-steel);
            padding-bottom: 1.1rem;
            margin-bottom: 1.5rem;
        }

        .bat-logo-container {
            width: 110px;
            margin: 0 auto 0.65rem auto;
            filter: drop-shadow(0 0 10px var(--bat-gold-glow));
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--bat-gold);
            font-weight: 900;
            font-size: 1.35rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .sys-subtitle {
            font-size: 0.72rem;
            color: #64748b;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .form-label {
            color: #94a3b8;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-control {
            background: #080a0e;
            border: 1px solid var(--bat-steel);
            border-left: 3px solid var(--bat-gold);
            border-radius: 4px;
            color: #f8fafc;
            font-size: 0.9rem;
            padding: 0.65rem 0.85rem;
            transition: all 0.2s ease;
        }

        .form-control::placeholder {
            color: #475569;
        }

        .form-control:focus {
            background: #0b0e14;
            border-color: var(--bat-gold);
            box-shadow: 0 0 12px var(--bat-gold-glow);
            color: #fff;
        }

        .btn-bat {
            background: var(--bat-gold);
            color: #050608;
            border: none;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 0.75rem;
            transition: all 0.2s ease;
            box-shadow: 0 0 15px rgba(245, 197, 24, 0.25);
        }

        .btn-bat:hover {
            background: #ffd633;
            color: #000;
            box-shadow: 0 0 22px rgba(245, 197, 24, 0.55);
            transform: translateY(-1px);
        }

        .btn-bat:active {
            transform: translateY(0);
        }

        .output-console {
            background: #07090c;
            border: 1px solid var(--bat-steel);
            border-radius: 4px;
            padding: 1rem;
            position: relative;
        }

        .output-console::before {
            content: "WAYNETECH // DATABASE FEED";
            display: block;
            font-size: 0.65rem;
            color: #475569;
            letter-spacing: 1.5px;
            margin-bottom: 0.5rem;
            border-bottom: 1px dashed #1e293b;
            padding-bottom: 0.35rem;
        }

        #output {
            color: var(--bat-gold);
            font-size: 0.88rem;
            line-height: 1.7;
            min-height: 54px;
        }
    </style>
</head>
<body class="p-4">

    <div class="container bat-terminal p-4" style="max-width: 480px;">
        <div class="bat-header text-center">
            <!-- Classic Yellow-Oval Batman Emblem -->
            <div class="bat-logo-container">
                <svg viewBox="0 0 500 296" xmlns="http://www.w3.org/2000/svg" width="100%" height="auto">
                    <!-- Outer Black Rim -->
                    <ellipse cx="250" cy="148" rx="246" ry="144" fill="#050608" stroke="#f5c518" stroke-width="4"/>
                    <!-- Classic Yellow Oval -->
                    <ellipse cx="250" cy="148" rx="234" ry="132" fill="#f5c518"/>
                    <!-- Classic Bat Silhouette -->
                    <path fill="#050608" d="M250,42 C246,42 243,66 240,74 C232,74 224,68 219,53 C214,68 214,92 194,95 C173,98 159,75 166,47 C100,74 44,118 44,154 C44,173 61,192 94,204 C89,182 103,167 125,167 C148,167 166,184 166,207 C166,211 165,215 164,218 C175,198 193,189 211,194 C229,199 243,217 250,248 C257,217 271,199 289,194 C307,189 325,198 336,218 C335,215 334,211 334,207 C334,184 352,167 375,167 C397,167 411,182 406,204 C439,192 456,173 456,154 C456,118 400,74 334,47 C341,75 327,98 306,95 C286,92 286,68 281,53 C276,68 268,74 260,74 C257,66 254,42 250,42 Z"/>
                </svg>
            </div>
            <h2>Batcomputer Roster</h2>
            <div class="sys-subtitle">Gotham Vigilante &amp; Ally Registry // Set Ops</div>
        </div>

        <div class="mb-3">
            <label for="first_name" class="form-label">Operative First Name</label>
            <input type="text" id="first_name" class="form-control" placeholder="e.g., Bruce, Dick, Barbara">
        </div>

        <div class="mb-4">
            <label for="last_name" class="form-label">Operative Last Name</label>
            <input type="text" id="last_name" class="form-control" placeholder="e.g., Wayne, Grayson, Gordon">
        </div>

        <button class="btn btn-bat w-100 mb-4" py-click="add_member">Authorize &amp; Log Operative</button>

        <div class="output-console">
            <div id="output">
                All members:<br>
                Total members: 0
            </div>
        </div>
    </div>

    <script type="py" src="./main.py"></script>

</body>
</html>
